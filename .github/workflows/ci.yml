name: AlexPy correctness and benchmarks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the native backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Confirm native module was compiled
        run: python -c "from alexpy import backend_name; assert backend_name() == 'native-c', backend_name()"
      - name: Run correctness tests
        run: python -m unittest discover -s tests -v
      - name: Audit long-lived stream amortization on THIS runner (advisory)
        if: matrix.python-version == '3.13'
        run: python -m alexpy.stream_bench --train-sizes 128,512,2048 --holdout-sizes 384 --changes 1 --queries 1,16 --spans both --ticks 2 --pairs 2 --sessions 3 --cycles 1,4,16 --reps 2 --device-tag github-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_id }} --json stream-economics.json
      - name: Upload environment-specific stream evidence (do not pool hosts)
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: alexpy-stream-${{ matrix.os }}-py313-${{ github.run_id }}
          path: stream-economics.json
      - name: Run scope-controlled benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.benchmark --require-native --sizes 1000 100000 --json benchmarks.json
      - name: Run bounded transition-graph QA
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.graph_search --require-native --cases 8 --repeat 9 --json graph-results.json --dot graph-states.dot
      - name: Diagnose candidate regressions across fresh interpreters
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.regression_triage --sessions 3 --repeat 9 --target-seconds .004 --json regression-triage.json
      - name: Compare opt-in A/B interventions (never auto-promote)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.intervention --sessions 3 --repeat 9 --target-seconds .004 --json intervention-results.json
      - name: Explore space-time, derivative, and multiscale axes (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.spacetime --hops 15 --repeats 7 --loops 200 --json spacetime.json
      - name: Probe lattice grid and blind length holdouts (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.lattice_lab --epochs 2 --repeats 5 --loops 25 --json lattice.json
      - name: Run native memory-hierarchy smoke protocol (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.memory_lab --sizes-kib 4 64 512 4096 --epochs 2 --repeats 2 --target-accesses 100000 --hardware-counters --json memory-lab.json
      - name: Inspect typed-buffer layout alternatives (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.layout_bench --sizes 0,8,128,4096 --epochs 2 --pairs 5 --target-seconds .001 --json layout.json
      - name: Measure list-to-buffer amortization (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.amortization_bench --sizes 8,4096 --repetitions 1,2,8 --epochs 2 --pairs 5 --target-seconds .001 --json amortization.json
      - name: Explore persistent sparse-update workflows (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.persistent_bench --sizes 64,4096 --changes 1,32 --reads 1,16 --ticks 4 --epochs 2 --pairs 5 --sessions 2 --target-ms .2 --json persistent.json --dot persistent-grid.dot
      - name: Verify dependency-DAG sparse updates against strong controls (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.dependency_bench --sizes 1024 --changes 1,8 --ticks 4 --reads 1,4 --sessions 2 --epochs 2 --pairs 3 --target-ms .2 --json dependency-results.json
      - name: Benchmark frozen compiled-DAG vs legacy, manual and dense controls (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.compiled_bench --sizes 1024 --changes 1,8 --ticks 4 --reads 1,4 --sessions 2 --epochs 2 --pairs 3 --json compiled-results.json
      - name: Verify partition-compiled DAG against four routes (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.partition_bench --sizes 1024 --changes 1,8 --ticks 4 --reads 1,4 --sessions 2 --epochs 2 --pairs 3 --json partition-results.json
      - name: Probe sparse ant-memory planner on blind holdout (advisory; no promotion)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.ant_bench --train-sizes 128,512 --holdout-sizes 256 --changes 1,4 --reads 1,4 --width 64 --ticks 2 --pairs 2 --sessions 2 --json ant-memory.json
      - name: Compare light/sound wavefront memory against ant and fixed manual (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.wave_bench --train-sizes 128,1024 --holdout-sizes 256 --changes 1 --reads 1,4 --width 64 --ticks 2 --pairs 2 --sessions 2 --json wave-memory.json
      - name: Check heterogeneous directed wavefront on blind holdout (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.hetero_bench --train-sizes 128,1024 --holdout-sizes 256 --changes 1 --reads 1,4 --width 64 --ticks 2 --pairs 2 --sessions 2 --json hetero-wave.json
      - name: Verify competing range plans and real switch costs (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.range_bench --train-sizes 128,512 --holdout-sizes 384 --changes 1 --queries 1,8 --spans short,wide --ticks 2 --pairs 2 --sessions 2 --json range-competition.json
      - name: Check stable cross-process routing and profile isolation (advisory)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: python -m alexpy.stable_bench --train-sizes 128,512 --holdout-sizes 384 --changes 1 --queries 1,8 --spans short --ticks 2 --pairs 2 --sessions 3 --no-probe --device-tag ci-ubuntu-py315 --json stable-memory.json
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        with:
          name: alexpy-benchmark-ubuntu-py315
          path: |
            benchmarks.json
            graph-results.json
            graph-states.dot
            regression-triage.json
            intervention-results.json
            spacetime.json
            lattice.json
            memory-lab.json
            layout.json
            amortization.json
            persistent.json
            persistent-grid.dot
            dependency-results.json
            compiled-results.json
            partition-results.json
            ant-memory.json
            wave-memory.json
            hetero-wave.json
            range-competition.json
            stable-memory.json
