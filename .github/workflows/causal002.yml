name: Genesis CAUSAL-002 evidence
on:
  push:
    branches: [feat/graph-search-mirrors-v02]
    paths: ['alexpy/causal_engine.py', 'alexpy/dynamic_causal.py', 'tests/test_causal_engine.py', 'tests/test_dynamic_causal.py', 'tests/causal002_bench.py', '.github/workflows/causal002.yml']
  pull_request:
    paths: ['alexpy/causal_engine.py', 'alexpy/dynamic_causal.py', 'tests/test_causal_engine.py', 'tests/test_dynamic_causal.py', 'tests/causal002_bench.py', '.github/workflows/causal002.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamic-causal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Independent correctness tests
        run: python -m unittest discover -s tests -p 'test_*causal*.py' -v
      - name: Frozen dynamic demand protocol (advisory)
        env:
          PYTHONPATH: .
        run: python tests/causal002_bench.py --output causal002-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: causal002-${{ matrix.os }}-${{ github.run_id }}
          path: causal002-results.json
          if-no-files-found: error
