name: Genesis CAUSAL-001 evidence
on:
  push:
    branches: [feat/graph-search-mirrors-v02]
    paths: ['alexpy/causal_engine.py', 'tests/test_causal_engine.py', 'tests/causal001_bench.py', '.github/workflows/causal001.yml']
  pull_request:
    paths: ['alexpy/causal_engine.py', 'tests/test_causal_engine.py', 'tests/causal001_bench.py', '.github/workflows/causal001.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Independent correctness tests
        run: python -m unittest discover -s tests -p test_causal_engine.py -v
      - name: Frozen protocol (timing advisory, no performance gate)
        env:
          PYTHONPATH: .
        run: python tests/causal001_bench.py --output causal001-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: causal001-${{ matrix.os }}-${{ github.run_id }}
          path: causal001-results.json
          if-no-files-found: error
